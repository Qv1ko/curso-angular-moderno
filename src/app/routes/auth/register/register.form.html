<form [formGroup]="form" (submit)="onSubmit()">
  <qv1-control
    [controlName]="'username'"
    [labelDisplay]="'Username'"
    [errors]="form.controls['username'].errors"
  >
    <input
      id="username"
      type="text"
      formControlName="username"
      [attr.aria-invalid]="form.controls['username'].invalid"
    />
  </qv1-control>
  <qv1-control
    [controlName]="'email'"
    [labelDisplay]="'Email'"
    [errors]="form.controls['email'].errors"
  >
    <input
      id="email"
      type="email"
      formControlName="email"
      [attr.aria-invalid]="form.controls['email'].invalid"
    />
  </qv1-control>
  <qv1-control
    [controlName]="'password'"
    [labelDisplay]="'Password'"
    [errors]="form.controls['password'].errors"
  >
    <input
      id="password"
      type="password"
      formControlName="password"
      [attr.aria-invalid]="form.controls['password'].invalid"
    />
  </qv1-control>
  <qv1-control
    [controlName]="'confirm'"
    [labelDisplay]="'Confirm Password'"
    [errors]="form.controls['confirm'].errors"
  >
    <input
      id="confirm"
      type="password"
      formControlName="confirm"
      [attr.aria-invalid]="form.controls['confirm'].invalid"
    />
  </qv1-control>
  <qv1-control
    [controlName]="'terms'"
    [labelDisplay]="'Accept the terms and conditions'"
    [errors]="form.controls['terms'].errors"
  >
    <input
      id="terms"
      type="checkbox"
      formControlName="terms"
      [attr.aria-invalid]="form.controls['terms'].invalid"
    />
  </qv1-control>
  <button type="submit" [disabled]="form.invalid">Register</button>
</form>

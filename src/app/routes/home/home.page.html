<article>
  <h2>Activities</h2>
  <main>
    @for (activity of activities(); track activity.id) {
    <qv1-activity [activity]="activity" />
    }
  </main>
</article>
<footer>
  <small>
    Showing
    <mark>{{ activities().length }}</mark>
    activities, you have selected
    <mark>{{ favorites().length }}</mark>
    favorites.
  </small>
</footer>

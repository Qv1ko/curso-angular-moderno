<footer>
  <nav>
    <span>
      <a [href]="author.github" target="_blank"
        >© {{ today | date: "yyyy" }} {{ author.nickname }}
      </a>
    </span>
    @if(hasNotifications()) {
    <button
      [attr.data-tooltip]="notificationsCount()"
      class="outline"
      (click)="toggleNotifications()"
    >
      🔥
    </button>
    }
    <span>
      @switch(cookiesStatus()) { @case ('pending') {
      <qv1-cookies (cancel)="cookiesStatus.set('rejected')" (accept)="cookiesStatus.set($event)" />
      } @case ('rejected') {
      <small>🍪❌</small>
      } @case ('essentials') {
      <small>🍪✅</small>
      } @case ('all') {
      <small>🍪✅✅</small>
      } }
    </span>
  </nav>
</footer>
@if (hasNotifications() && showNotification()) {
<qv1-notifications [notifications]="notifications()" (close)="onNotificationClose()" />
}

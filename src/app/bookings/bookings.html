<article>
  <header>
    <h2>{{ activity | activityTitle }}</h2>
    <div [className]="activity.status">
      <span>{{ activity.date | date:"dd-MMM-yyyy" }}</span>
      <span>{{ activity.status | uppercase }}</span>
      <span>{{ activity.price | currency }}</span>
    </div>
  </header>
  <main>
    <h4>Participants</h4>
    <div>Already Participants: {{ currentParticipants }}</div>
    <div>New Participants: {{ newParticipants() }}</div>
  </main>
  <footer>
    <h4>New Bookings</h4>
    <label for="newParticipants">How many participants want to book?</label>
    <input
      type="number"
      [ngModel]="newParticipants()"
      (ngModelChange)="onNewParticipantsChange($event)"
    />
    <button [disabled]="booked()" (click)="onBookClick()">Book now!</button>
    {{ booked() ? 'Booked!' : '' }}
  </footer>
</article>
